# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and Publish Nightly Build
on:
  push:
    branches: ["dev"]
permissions:
  contents: write
  
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Publish
      run: dotnet publish -c Release
    - name : zip the publish 
      run : Compress-Archive -Path "WPFetch\bin\Release\net9.0-windows7.0\publish\*" -DestinationPath 'wpfetch-nightly.zip'
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        # A file, directory or wildcard pattern that describes what to upload.
        path: wpfetch-nightly.zip
        # The desired behavior if no files are found using the provided path.
        archive: true

  release:
      name: Create Nightly Release
      needs: [build]
      runs-on: ubuntu-latest
      steps:
        - name: Download all artifacts
          uses: actions/download-artifact@v8.0.1
          with:
            path: ./artifacts
            merge-multiple: true

        - name: Upload Nightly
          uses: andelf/nightly-release@main
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            tag_name: nightly
            name: Nightly Release
            body: "Automatic Nighty (daily) binary build powered by GtiHub Actions."
            files: |
              ./artifacts/*.zip
    
          
